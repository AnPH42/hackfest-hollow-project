<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hollow Mesh — Live Board</title>
  <style>
    :root { --bg:#0a0d13; --panel:#121722; --line:#232b3b; --text:#e8ebf2; --muted:#8a93a8; --accent:#ffb020; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); padding: 16px 22px 30px;
      font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    header { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
    h1 { font-size: 20px; margin: 0; } h1 span { color: var(--muted); font-weight: 400; }
    .join { font-size: 15px; color: var(--muted); }
    .join b { color: var(--accent); font-size: 18px; font-variant-numeric: tabular-nums; }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 16px; align-items: start; }
    @media (max-width: 950px) { .layout { grid-template-columns: 1fr; } }
    .level { border-radius: 14px; padding: 12px 16px 14px; margin-bottom: 14px; border: 1px solid var(--line); min-height: 96px; }
    .level h2 { font-size: 12px; margin: 0 0 8px; letter-spacing: .08em; text-transform: uppercase; color: #aab4c6; }
    .L0 { background: #16313f; } .L1 { background: #232a33; } .L2 { background: #2d211d; } .L3 { background: #28150f; }
    .chips { display: flex; gap: 10px; flex-wrap: wrap; min-height: 40px; }
    .none { color: var(--muted); font-size: 13px; align-self: center; }
    .phone { padding: 8px 14px; border-radius: 999px; background: #0d1119; border: 2px solid #3a4357;
      font-size: 14px; font-variant-numeric: tabular-nums; transition: border-color .2s; }
    .phone.got { border-width: 3px; }
    .phone.flash { animation: flash .9s ease-out; }
    @keyframes flash { 0% { box-shadow: 0 0 0 0 var(--c); transform: scale(1.12); } 100% { box-shadow: 0 0 0 16px transparent; transform: scale(1); } }
    .shaft { color: var(--muted); font-size: 12px; text-align: center; margin: -6px 0 8px; }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 14px; }
    .panel h3 { margin: 0 0 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
    .line { font-size: 13px; padding: 3px 0 3px 8px; border-left: 3px solid var(--muted); margin-bottom: 4px; }
    .line span { color: var(--muted); }
    .stat { display: flex; justify-content: space-between; font-size: 14px; padding: 2px 0; }
    .stat b { font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <header>
    <h1>Hollow Mesh <span>· live board</span></h1>
    <div class="join" id="join">Phones join at <b>…</b></div>
  </header>
  <div class="layout">
    <div id="levels"></div>
    <div>
      <div class="panel">
        <h3>Network</h3>
        <div class="stat"><span>Phones online</span><b id="sPhones">0</b></div>
        <div class="stat"><span>Messages handed over</span><b id="sHops">0</b></div>
      </div>
      <div class="panel">
        <h3>Message log</h3>
        <div id="log"><div class="line"><span>Waiting for phones…</span></div></div>
      </div>
    </div>
  </div>
  <script type="module" src="./board.js"></script>
</body>
</html>
